version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./public:/app/public
      - ./routes:/app/routes
      - ./config:/app/config
      - ./server.js:/app/server.js
    command: node server.js
