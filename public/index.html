<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <h1 class="nav-title">Forum</h1>
      </div>
      <div class="nav-right" id="nav-actions">
        <a href="/login" id="login-link" class="btn btn-primary" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login
        </a>
        <button id="new-post-btn" class="btn btn-primary" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          New Post
        </button>
        <button id="logout-btn" class="btn btn-secondary" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-card">
          <h2 class="sidebar-title">Categories</h2>
          <div class="category-list" id="category-list">
            <button class="category-btn active" data-category="">All Posts</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div id="loading" class="loading" style="display: none;">
          <div class="spinner"></div>
        </div>

        <div id="post-list" class="post-list"></div>

        <div id="post-detail" class="post-detail" style="display: none;">
          <button id="back-btn" class="btn btn-secondary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Posts
          </button>
          <div id="post-content"></div>
          <div id="comments-section"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="create-post-modal" class="modal" style="display: none;">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Post</h2>
        <button class="modal-close" id="close-create-post-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="create-post-form">
          <div class="form-group">
            <label for="post-title">Title</label>
            <input type="text" id="post-title" required>
          </div>
          <div class="form-group">
            <label for="post-category">Category</label>
            <select id="post-category" required>
              <option value="categories">Select a category</option>
            </select>
          </div>
          <div class="form-group">
            <label for="post-content">Content</label>
            <textarea id="post-content" rows="6" required></textarea>
          </div>
          <div id="create-post-error" class="error-message" style="display: none;"></div>
          <button type="submit" class="btn btn-primary btn-block">Create Post</button>
        </form>
      </div>
    </div>
  </div>

  

  <script src="/js/app.js"></script>
</body>
</html>
